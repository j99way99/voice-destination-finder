<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>음성 목적지 검색</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─────────── 로그인 / 회원가입 ─────────── -->
<section id="authView" class="auth" hidden>
  <div class="auth__card">
    <h1 class="title">음성 목적지 검색</h1>
    <p class="subtitle">자주 가는 곳을 저장해두고, 이름만 말해서 불러오세요</p>

    <form id="authForm" class="auth__form" novalidate>
      <label class="field">
        <span class="field__label">이메일</span>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </label>
      <label class="field">
        <span class="field__label">비밀번호</span>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상" />
      </label>
      <button id="authSubmit" class="btn btn--primary" type="submit">로그인</button>
    </form>

    <p class="auth__toggle">
      <span id="authToggleText">아직 계정이 없으신가요?</span>
      <button id="authToggle" class="linkbtn" type="button">회원가입</button>
    </p>
    <p id="authError" class="error" hidden></p>
  </div>
</section>

<!-- ─────────── 메인 앱 ─────────── -->
<main id="appView" class="app" hidden>
  <header class="app__header">
    <h1 class="title">음성 목적지 검색</h1>
    <div class="app__user">
      <span id="userEmail" class="app__email"></span>
      <button id="logoutBtn" class="linkbtn" type="button">로그아웃</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" type="button" role="tab" data-tab="voice">음성 검색</button>
    <button class="tab" type="button" role="tab" data-tab="places">목적지 관리</button>
  </nav>

  <!-- ── 탭 1: 음성 검색 ── -->
  <section id="panel-voice" class="panel is-active" role="tabpanel">
    <!-- 모드 선택 -->
    <div id="modePicker" class="mode">
      <p class="mode__question">어떻게 찾을까요?</p>
      <button class="mode__card" type="button" data-mode="saved">
        <span class="mode__icon" aria-hidden="true">★</span>
        <span class="mode__body">
          <span class="mode__title">등록된 주소로 찾기</span>
          <span class="mode__desc">저장해둔 이름을 말하면 바로 불러옵니다<br>예) "딸내미집"</span>
        </span>
        <span id="modeSavedCount" class="mode__count"></span>
      </button>
      <button class="mode__card" type="button" data-mode="new">
        <span class="mode__icon" aria-hidden="true">⌖</span>
        <span class="mode__body">
          <span class="mode__title">새 주소로 찾기</span>
          <span class="mode__desc">말한 장소를 지도에서 바로 검색합니다<br>예) "강남역 2번 출구"</span>
        </span>
      </button>
    </div>

    <!-- 음성 입력 -->
    <div id="voiceStage" hidden>
    <div class="stage-head">
      <button id="backBtn" class="linkbtn" type="button">← 모드 변경</button>
      <span id="modeLabel" class="stage-head__mode"></span>
    </div>

    <div class="mic-zone">
      <div class="mic-wrap">
        <span class="ripple ripple--1" aria-hidden="true"></span>
        <span class="ripple ripple--2" aria-hidden="true"></span>
        <span class="ripple ripple--3" aria-hidden="true"></span>
        <button id="micBtn" class="mic" type="button" aria-label="음성 입력 시작">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Z"/>
            <path fill="currentColor" d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.4v2.2h-2a.9.9 0 0 0 0 1.8h5.8a.9.9 0 0 0 0-1.8h-2v-2.2a6.5 6.5 0 0 0 5.6-6.4Z"/>
          </svg>
        </button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">대기 중</p>
    </div>

    <div class="transcript" aria-label="인식된 음성">
      <span class="transcript__label">TRANSCRIPT</span>
      <p id="transcript" class="transcript__text is-empty">— 아직 인식된 음성이 없습니다 —</p>
      <p id="query" class="transcript__query" hidden></p>
    </div>

    <div class="map-zone">
      <div id="map" class="map"></div>
      <div id="mapFallback" class="map__fallback">지도를 불러오는 중…</div>
    </div>

    <div id="confirmCard" class="confirm" hidden>
      <ul id="candidates" class="candidates"></ul>
      <div class="result">
        <span class="result__label">최종 목적지 주소</span>
        <p id="resultAddress" class="result__addr"></p>
        <p id="resultName" class="result__name"></p>
      </div>
      <div class="confirm__actions">
        <button id="yesBtn" class="btn btn--primary" type="button">맞아요</button>
        <button id="retryBtn" class="btn btn--ghost" type="button">다시 말할게요</button>
      </div>
    </div>

    <p id="error" class="error" hidden></p>
    </div><!-- /voiceStage -->
  </section>

  <!-- ── 탭 2: 목적지 관리 ── -->
  <section id="panel-places" class="panel" role="tabpanel" hidden>
    <form id="placeForm" class="card" novalidate>
      <label class="field">
        <span class="field__label">목적지 이름</span>
        <input id="placeName" type="text" required placeholder="예: 딸내미집" maxlength="20" />
      </label>

      <label class="field">
        <span class="field__label">주소 검색</span>
        <div class="field__row">
          <input id="placeSearch" type="text" placeholder="장소명 또는 주소 입력" />
          <button id="placeSearchBtn" class="btn btn--ghost btn--sm" type="button">검색</button>
        </div>
      </label>

      <ul id="searchResults" class="candidates" hidden></ul>

      <p id="pickedAddress" class="picked" hidden></p>
      <button id="saveBtn" class="btn btn--primary" type="submit" disabled>목적지 저장</button>
      <p id="placeError" class="error" hidden></p>
    </form>

    <div class="card">
      <h2 class="card__title">저장된 목적지</h2>
      <ul id="savedList" class="saved"></ul>
      <p id="savedEmpty" class="muted-note">아직 저장된 목적지가 없습니다.</p>
    </div>
  </section>
</main>

<p id="bootError" class="boot-error" hidden></p>

<script src="config.js" onerror="window.__configMissing=true"></script>
<script type="module" src="script.js"></script>
</body>
</html>
